<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: {{accent}}; }
    .nav-link { transition: color 0.15s ease; }
    .nav-link:hover { color: {{accent}}; }
    .toolbtn { transition: background 0.15s ease, color 0.15s ease; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #FBFAF8; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #201F1C;">

  <!-- soft studio floor glow under the car -->
  <div style="position: absolute; left: 50%; top: 560px; width: 900px; height: 220px; transform: translateX(-50%); background: radial-gradient(ellipse at center, rgba(32,31,28,0.08) 0%, rgba(32,31,28,0) 70%); pointer-events: none;"></div>

  <!-- top nav -->
  <div style="position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 36px 56px;">
    <div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600; font-size: 19px; letter-spacing: 0.06em;">AUTOCRAFT</div>
    <div style="display: flex; align-items: center; gap: 40px; font-size: 14px; letter-spacing: 0.02em; color: #55524A;">
      <a href="#" class="nav-link">My Garage</a>
      <a href="#" class="nav-link">Log in</a>
    </div>
  </div>

  <!-- hero: car name + illustration -->
  <div style="position: absolute; top: 150px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <div style="font-size: 12px; letter-spacing: 0.22em; color: #8A867B; text-transform: uppercase;">AutoCraft Demo</div>
    <div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 500; font-size: 56px; letter-spacing: -0.01em; color: #201F1C;">Roadster</div>
  </div>

  <!-- car illustration -->
  <svg width="640" height="220" viewBox="0 0 640 220" style="position: absolute; top: 330px; left: 50%; transform: translateX(-50%);">
    <g stroke="#201F1C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 70 160 C 70 130 100 128 130 118 L 195 78 C 220 64 255 58 300 58 L 430 58 C 470 58 500 66 525 82 L 565 118 C 585 122 605 128 605 160" />
      <path d="M 70 160 L 40 160 C 30 160 24 154 24 146 L 24 138" />
      <path d="M 605 160 L 620 160 C 628 160 634 154 634 146 L 634 140" />
      <path d="M 130 118 L 165 78 L 215 78 L 200 118 Z" />
      <path d="M 225 118 L 240 78 L 320 78 L 320 118 Z" />
      <path d="M 330 118 L 330 78 L 405 78 L 420 118 Z" />
      <path d="M 24 142 L 634 142" />
    </g>
    <g>
      <circle cx="168" cy="162" r="34" fill="#FBFAF8" stroke="#201F1C" stroke-width="2.5" />
      <circle cx="168" cy="162" r="13" fill="none" stroke="#201F1C" stroke-width="2" />
      <circle cx="490" cy="162" r="34" fill="#FBFAF8" stroke="#201F1C" stroke-width="2.5" />
      <circle cx="490" cy="162" r="13" fill="none" stroke="#201F1C" stroke-width="2" />
    </g>
  </svg>

  <!-- scroll / cursor hint -->
  <div style="position: absolute; top: 600px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 10px; color: #8A867B; font-size: 13px; letter-spacing: 0.03em;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A867B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 3 C7.5 6.5 7.5 17.5 12 21" />
      <path d="M12 3 C16.5 6.5 16.5 17.5 12 21" />
      <path d="M3 12 L21 12" />
    </svg>
    Move your cursor or scroll to explore
  </div>

  <!-- bottom customization toolbar -->
  <div style="position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 16px;">

    <!-- expanded paint swatch row -->
    <div style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border: 1px solid #EAE7DF; border-radius: 999px; padding: 12px 22px; box-shadow: 0 12px 32px rgba(32,31,28,0.07);">
      <span style="font-size: 12px; color: #8A867B; letter-spacing: 0.04em; margin-right: 4px;">Paint</span>
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #B5261F; border: 2px solid {{accent}}; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 3px {{accent}};"></div>
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #2A4C74;"></div>
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #1E1D1B;"></div>
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #C9C2B2;"></div>
    </div>

    <!-- icon toolbar -->
    <div style="display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1px solid #EAE7DF; border-radius: 999px; padding: 10px; box-shadow: 0 14px 36px rgba(32,31,28,0.08);">

      <div class="toolbtn" style="display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-size: 13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.5" />
          <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none" />
        </svg>
        Paint
      </div>

      <div class="toolbtn" style="display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; color: #55524A; font-size: 13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.5" />
          <path d="M12 3.5 L12 8.5 M12 15.5 L12 20.5 M3.5 12 L8.5 12 M15.5 12 L20.5 12 M6 6 L9.5 9.5 M14.5 14.5 L18 18 M18 6 L14.5 9.5 M9.5 14.5 L6 18" />
        </svg>
        Wheels
      </div>

      <div class="toolbtn" style="display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; color: #55524A; font-size: 13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 19 L5 12 C5 8 8 5.5 12 5.5 C16 5.5 19 8 19 12 L19 19" />
          <path d="M5 19 L19 19" />
          <path d="M7 19 L7 15.5 C7 13.8 8.5 12.5 10 12.5 L14 12.5 C15.5 12.5 17 13.8 17 15.5 L17 19" />
        </svg>
        Interior
      </div>

      <div class="toolbtn" style="display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; color: #55524A; font-size: 13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 10 L14 10 C16.5 10 18 12 18 14 L18 15" />
          <circle cx="19.5" cy="15" r="2.3" />
        </svg>
        Exhaust
      </div>

      <div class="toolbtn" style="display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; color: #55524A; font-size: 13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="3" />
          <path d="M9 4 L9 20 M13 4 L13 20" />
        </svg>
        Decals
      </div>

    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#C6641E","options":["#C6641E","#2A4C74","#7A6A53","#B5261F"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C6641E' };
  }
}
</script>
</body>
</html>
