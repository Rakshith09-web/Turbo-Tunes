{% if messages %}
  <ul class="messages" aria-live="polite">
    {% for message in messages %}
      <li class="flash flash-{% if message.level_tag == 'error' %}error{% else %}success{% endif %}" role="status">
        {% if message.level_tag == 'error' %}
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>
        {% else %}
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></svg>
        {% endif %}
        <span>{{ message }}</span>
      </li>
    {% endfor %}
  </ul>
{% endif %}
