{% extends "base.html" %}
{% load static %}
{% block title %}{{ car }} — Customizer{% endblock %}
{% block extra_head %}

{% endblock %}
{% block content %}
  <h1>{{ car }}</h1>
  {{ car_data|json_script:"car-data" }}

    <div id="viewer"></div>
    <aside id="options-panel"></aside>
  </div>
{% endblock %}
