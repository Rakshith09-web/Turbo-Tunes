{% extends "base.html" %}
{% load static %}
{% block title %}{{ car }} — Customizer{% endblock %}
{% block extra_head %}
  <link rel="stylesheet" href="{% static 'cars/css/customizer.css' %}" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
{% endblock %}
{% block content %}
  <div class="customizer-hero">
    <div class="car-eyebrow">{{ car.brand }}</div>
    <h1 class="car-title">{{ car.name }}</h1>
  </div>
  {{ car_data|json_script:"car-data" }}
  <div class="viewer-stage">
    <div id="viewer"></div>
    <div class="viewer-hint">Drag to rotate — move your cursor to look around</div>
    <div id="options-panel"></div>
  </div>
  <script type="module" src="{% static 'cars/js/viewer.js' %}"></script>
{% endblock %}
